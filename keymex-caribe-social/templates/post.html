<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--gris); }
  .pad { position: absolute; left: 72px; right: 72px; }

  /* 1 · PORTADA */
  .s-cover .tag { position: absolute; top: 72px; left: 72px; font-size: 24px; padding: 14px 26px; }
  .s-cover .top-logo { position: absolute; top: 64px; right: 72px; font-size: 44px; height: 70px; }
  .s-cover .top-logo .logo-img { height: 48px; }
  .s-cover .confotur { position: absolute; top: 150px; right: 72px; width: 170px; }
  .s-specs .confotur { position: absolute; top: 64px; left: 72px; width: 150px; }
  .s-specs .panel .logo-img { position: absolute; right: 72px; top: 70px; height: 34px; }
  .s-cta .contact .logo-img { height: 62px; }
  .s-cover .bottom { bottom: 78px; color: var(--blanco); }
  .s-cover .zona { font-size: 26px; font-weight: 500; margin-bottom: 22px; display:flex; align-items:center; gap:14px; }
  .s-cover .zona::before { content:""; width: 48px; height: 3px; background: var(--rojo); display:inline-block; }
  .s-cover h1 { font-size: 86px; font-weight: 800; line-height: 1.02; letter-spacing: -0.01em; max-width: 900px; }
  .s-cover .row { display:flex; justify-content: space-between; align-items: flex-end; margin-top: 40px; padding-top: 34px; border-top: 1px solid rgba(255,255,255,.35); }
  .s-cover .precio { font-size: 54px; font-weight: 700; }
  .s-cover .precio small { display:block; font-size: 20px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; opacity: .85; margin-bottom: 8px; }
  .s-cover .mini { font-family: "Poppins"; font-size: 26px; font-weight: 500; text-align: right; opacity: .95; }

  /* 2 · FICHA */
  .s-specs .photo { bottom: 560px; }
  .s-specs .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: var(--blanco); padding: 64px 72px; }
  .s-specs .kicker { color: var(--rojo); font-size: 22px; font-weight: 700; }
  .s-specs h2 { font-size: 54px; font-weight: 800; margin: 14px 0 44px; line-height: 1.05; }
  .s-specs .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 2px solid var(--negro); }
  .s-specs .cell { padding: 34px 0 0; border-right: 1px solid #ddd; padding-left: 24px; }
  .s-specs .cell:first-child { padding-left: 0; }
  .s-specs .cell:last-child { border-right: 0; }
  .s-specs .cell svg { width: 44px; height: 44px; stroke: var(--rojo); }
  .s-specs .num { font-size: 58px; font-weight: 800; margin-top: 14px; line-height: 1; }
  .s-specs .num sup { font-size: 26px; }
  .s-specs .lbl { font-size: 19px; font-weight: 600; color: var(--gris-txt); margin-top: 10px; }
  .s-specs .badge { position: absolute; top: 64px; right: 72px; }
  .s-specs .badge .tag { font-size: 20px; padding: 12px 22px; }

  /* 3 · GALERÍA + DESTACADOS */
  .s-gallery { background: var(--blanco); }
  .s-gallery .a { position: absolute; left: 0; top: 0; width: 640px; height: 1350px; background-size: cover; background-position: center; }
  .s-gallery .b { position: absolute; right: 0; top: 0; width: 440px; height: 600px; background-size: cover; background-position: center; }
  .s-gallery .list { position: absolute; right: 0; top: 600px; width: 440px; bottom: 0; background: var(--rojo); color: var(--blanco); padding: 56px 48px; }
  .s-gallery .list h3 { font-size: 22px; font-weight: 700; margin-bottom: 30px; }
  .s-gallery .list li { list-style: none; font-size: 27px; font-weight: 500; line-height: 1.25; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.28); }
  .s-gallery .list li:last-child { border-bottom: 0; }

  /* 4 · LIFESTYLE */
  .s-life .quote { bottom: 120px; color: var(--blanco); }
  .s-life .quote p { font-size: 74px; font-weight: 300; font-style: italic; line-height: 1.12; max-width: 880px; }
  .s-life .quote .bar { width: 72px; height: 6px; background: var(--rojo); margin-bottom: 40px; }
  .s-life .quote .zona { margin-top: 36px; font-size: 22px; font-weight: 600; }

  /* 5 · CTA */
  .s-cta { background: var(--rojo); color: var(--blanco); }
  .s-cta .thumb { position: absolute; left: 72px; right: 72px; top: 72px; height: 560px; background-size: cover; background-position: center; }
  .s-cta .body { top: 700px; }
  .s-cta h2 { font-size: 80px; font-weight: 800; line-height: 1.02; }
  .s-cta .lead { font-family: "Poppins"; font-size: 30px; font-weight: 500; margin-top: 22px; opacity: .95; }
  .s-cta .contact { position: absolute; left: 72px; right: 72px; bottom: 72px; display:flex; justify-content: space-between; align-items:flex-end; border-top: 1px solid rgba(255,255,255,.4); padding-top: 36px; }
  .s-cta .agent b { display:block; font-size: 32px; font-weight: 700; }
  .s-cta .agent span { display:block; font-size: 26px; font-weight: 500; margin-top: 8px; }
  .s-cta .logo { font-size: 58px; height: 92px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script>
<script>
(function () {
  const d = window.__DATA__;
  const f = d.fotos;
  const pick = (i) => f[Math.min(i, f.length - 1)];
  const bg = (src) => `background-image:url('${src}')`;
  const zonaTxt = [d.zona, d.ciudad].filter(Boolean).join(", ");
  const op = (d.operacion || "VENTA").toUpperCase();
  const slides = [];

  // 1 · Portada
  slides.push(`
  <section class="slide s-cover">
    <div class="photo" style="${bg(pick(0))}"></div>
    <div class="shade-top"></div><div class="shade-bottom"></div>
    <span class="tag">${esc(d.etiqueta || "En " + op.toLowerCase())}</span>
    <div class="top-logo">${logoHTML("blanco")}</div>
    ${confoturHTML()}
    <div class="pad bottom">
      <div class="zona caps">${esc(zonaTxt)}</div>
      <h1>${esc(d.titulo)}</h1>
      <div class="row">
        <div class="precio"><small>${op === "ALQUILER" ? "Alquiler" : "Precio"}</small>${esc(d.precio || "Consultar")}</div>
        <div class="mini">${specsLine(d)}</div>
      </div>
    </div>
  </section>`);

  // 2 · Ficha técnica
  const cells = specCells(d).slice(0, 4);
  slides.push(`
  <section class="slide s-specs">
    <div class="photo" style="${bg(pick(1))}"></div>
    <div class="badge"><span class="tag">${esc(d.tipo || "Propiedad")}</span></div>
    ${confoturHTML()}
    <div class="panel">
      ${d.__logos && d.__logos.rojo ? logoHTML("rojo") : ""}
      <div class="kicker caps">Ficha de la propiedad</div>
      <h2>${esc(d.subtitulo || d.titulo)}</h2>
      <div class="grid">${cells.map(c => `
        <div class="cell">${ICONS[c.icon]}<div class="num">${c.num}</div><div class="lbl caps">${c.lbl}</div></div>`).join("")}
      </div>
    </div>
  </section>`);

  // 3 · Galería + destacados
  const dest = (d.destacados && d.destacados.length ? d.destacados : (d.amenidades || [])).slice(0, 5);
  slides.push(`
  <section class="slide s-gallery">
    <div class="a" style="${bg(pick(2))}"></div>
    <div class="b" style="${bg(pick(3))}"></div>
    <div class="list"><h3 class="caps">Lo que la hace única</h3><ul>${dest.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
  </section>`);

  // 4 · Lifestyle (solo si hay frase y foto extra)
  if (d.frase_lifestyle) {
    slides.push(`
    <section class="slide s-life">
      <div class="photo" style="${bg(pick(4))}"></div>
      <div class="shade-bottom"></div>
      <div class="pad quote"><div class="bar"></div><p>${esc(d.frase_lifestyle)}</p><div class="zona caps">${esc(zonaTxt)}</div></div>
    </section>`);
  }

  // 5 · CTA
  const a = d.agente || {};
  slides.push(`
  <section class="slide s-cta">
    <div class="thumb" style="${bg(pick(5))}"></div>
    <div class="pad body">
      <h2>${esc(d.cta_titulo || "Agenda tu visita privada")}</h2>
      <div class="lead">${esc(d.cta_texto || "Escríbenos por WhatsApp y recibe la ficha completa.")}</div>
    </div>
    <div class="contact">
      <div class="agent"><b>${esc(a.nombre || d.oficina || "KEYMEX Caribe")}</b><span>${esc(a.telefono || "")}</span><span>${esc(d.instagram || "")}</span></div>
      <div>${logoHTML("blanco")}</div>
    </div>
  </section>`);

  document.getElementById("root").innerHTML = slides.join("");
})();
</script>
</body>
</html>
