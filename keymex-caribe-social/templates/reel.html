<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* Zonas seguras de Reels: texto entre y=220 y y=1500, margen derecho 140px (botones de IG) */
  .scene { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  .scene .corner { position: absolute; top: 110px; left: 72px; font-size: 40px; }
  .scene .corner .logo-img { height: 42px; }
  .end .logo-img { height: 100px; margin-bottom: 90px; }
  .scene .confotur { position: absolute; top: 96px; right: 150px; width: 170px; }
  .scene .shade-b { position: absolute; left:0; right:0; bottom:0; height: 1100px; background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0)); }
  .scene .shade-t { position: absolute; left:0; right:0; top:0; height: 420px; background: linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,0)); }

  /* Hook */
  .hook .box { position: absolute; left: 72px; right: 140px; top: 520px; color: var(--blanco); }
  .hook .tag { font-size: 28px; padding: 14px 26px; margin-bottom: 36px; }
  .hook h1 { font-size: 104px; font-weight: 800; line-height: 1.02; letter-spacing: -0.01em; text-shadow: 0 4px 30px rgba(0,0,0,.35); }
  .hook .zona { margin-top: 36px; font-size: 30px; font-weight: 600; }

  /* Dato (lower third) */
  .fact .card { position: absolute; left: 72px; bottom: 470px; max-width: 820px; }
  .fact .k { display:inline-block; background: var(--rojo); color: var(--blanco); font-family:"Poppins"; font-weight:600; font-size: 26px; letter-spacing:.16em; text-transform:uppercase; padding: 12px 22px; }
  .fact .v { background: var(--blanco); color: var(--negro); font-size: 66px; font-weight: 800; line-height: 1.05; padding: 26px 34px 30px; }

  /* Precio */
  .price .box { position: absolute; left: 72px; right: 140px; bottom: 470px; color: var(--blanco); }
  .price .zona { font-size: 30px; font-weight: 600; display:flex; gap: 16px; align-items:center; }
  .price .zona::before { content:""; width: 56px; height: 4px; background: var(--rojo); }
  .price .p { font-size: 110px; font-weight: 800; margin-top: 22px; line-height: 1; }
  .price .s { font-family:"Poppins"; font-size: 34px; font-weight: 500; margin-top: 24px; }

  /* Cierre */
  .end { background: var(--rojo) !important; color: var(--blanco); }
  .end .center { position: absolute; left: 90px; right: 90px; top: 0; bottom: 0; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
  .end .logo { font-size: 96px; height: 150px; margin-bottom: 90px; }
  .end h2 { font-size: 92px; font-weight: 800; line-height: 1.02; }
  .end .lead { font-family:"Poppins"; font-size: 38px; font-weight: 500; margin-top: 30px; }
  .end .contact { margin-top: 90px; padding-top: 40px; border-top: 2px solid rgba(255,255,255,.45); width: 100%; }
  .end .contact b { display:block; font-size: 44px; font-weight: 700; }
  .end .contact span { display:block; font-size: 36px; font-weight: 500; margin-top: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script>
<script>
(function () {
  const d = window.__DATA__;
  const html = d.__scenes.map((s) => {
    if (s.type === "hook") return `
      <section class="scene hook"><div class="shade-t"></div><div class="shade-b"></div>
        <div class="corner">${logoHTML("blanco")}</div>${confoturHTML()}
        <div class="box"><span class="tag">${esc(s.tag)}</span><h1>${esc(s.text)}</h1><div class="zona caps">${esc(s.sub)}</div></div>
      </section>`;
    if (s.type === "fact") return `
      <section class="scene fact"><div class="shade-t"></div>
        <div class="corner">${logoHTML("blanco")}</div>
        <div class="card"><div class="k">${esc(s.sub)}</div><div class="v">${s.html || esc(s.text)}</div></div>
      </section>`;
    if (s.type === "price") return `
      <section class="scene price"><div class="shade-t"></div><div class="shade-b"></div>
        <div class="corner">${logoHTML("blanco")}</div>${confoturHTML()}
        <div class="box"><div class="zona caps">${esc(s.sub)}</div><div class="p">${esc(s.text)}</div><div class="s">${esc(s.extra || "")}</div></div>
      </section>`;
    if (s.type === "end") return `
      <section class="scene end"><div class="center">
        ${logoHTML("blanco")}
        <h2>${esc(s.text)}</h2><div class="lead">${esc(s.sub)}</div>
        <div class="contact"><b>${esc(s.name)}</b><span>${esc(s.phone)}</span><span>${esc(s.ig)}</span></div>
      </div></section>`;
    return "";
  }).join("");
  document.getElementById("root").innerHTML = html;
})();
</script>
</body>
</html>
